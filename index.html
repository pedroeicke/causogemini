    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #FFFFFF;
        color: #333333;
      }
      .font-montserrat {
        font-family: 'Montserrat', sans-serif;
      }
      .text-petrol { color: #002D4B; }
      .bg-petrol { background-color: #002D4B; }
      .text-gold { color: #CDAA7D; }
      .bg-gold { background-color: #CDAA7D; }
      .border-gold { border-color: #CDAA7D; }
      .bg-light-gray { background-color: #F4F4F4; }
      .text-soft-black { color: #333333; }

      /* Animation for background effects */
      @keyframes float {
        0% { transform: translateY(20px) rotate(0deg); opacity: 0; }
        25% { opacity: 0.1; }
        50% { transform: translateY(-20px) rotate(180deg); opacity: 0.15; }
        75% { opacity: 0.1; }
        100% { transform: translateY(-40px) rotate(360deg); opacity: 0; }
      }
      .plus-effect {
        position: absolute;
        color: #4FD1C5;
        font-weight: 200;
        user-select: none;
        animation: float 15s infinite ease-in-out;
      }
    </style>
